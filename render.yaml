services:
  - type: web
    name: global-bypass-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: PORT
        value: 8080
      - key: BOT_NAME
        value: GLOBAL BYPASS
